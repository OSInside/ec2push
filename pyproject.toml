[project]
name = "ec2push"
version = "0.1.0"
description = "Upload a raw disk image to AWS EC2 and register it as AMI"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "boto3 (>=1.34.0)",
    "cryptography (>=41.0.0)",
    "paramiko (>=3.4.0)",
    "rich (>=13.0.0)",
    "typer (>=0.12.0)",
]

[project.scripts]
ec2push = "ec2push.cli:app"

[tool.poetry]
packages = [{ include = "ec2push" }]

[tool.poetry.group.dev.dependencies]
flake8 = ">=7.0.0"
moto = { version = ">=5.0.0", extras = ["ec2", "ssm"] }
pytest = ">=8.0.0"
pytest-cov = ">=5.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
